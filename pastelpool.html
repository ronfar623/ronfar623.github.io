  #chatBar input{width:340px;padding:10px 14px;font-size:16px;border:2px solid #FF8FAB;border-radius:10px;background:#fff;color:#5A4A6A}

<body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="mpPanel"><h2 style="margin:0 0 12px">2 PLAYERS (NETWORK)</h2>
 <div>
  <div><button id="mpP2pHostBtn">HOST</button><button id="mpP2pJoinBtn">JOIN</button></div>
  <div style="font-size:13px;color:#9A8AA8;margin-bottom:6px">Both players on the same network — copy/paste the codes</div>
  <div id="p2pOfferBox" style="display:none">
   <b style="font-size:14px">1. Send this OFFER code to the other player</b>
   <textarea id="p2pOfferOut" rows="4" readonly style="width:100%;box-sizing:border-box;font:11px monospace;margin:4px 0;padding:6px;border:2px solid #E8B4C8;border-radius:8px"></textarea>
   <button id="p2pOfferCopyBtn">COPY OFFER</button><button id="p2pOfferRegenBtn" style="background:#9A8AA8">REGENERATE</button>
   <b style="font-size:14px;display:block;margin-top:10px">2. Paste their ANSWER code</b>
   <textarea id="p2pAnswerIn" rows="4" style="width:100%;box-sizing:border-box;font:11px monospace;margin:4px 0;padding:6px;border:2px solid #E8B4C8;border-radius:8px"></textarea>
   <button id="p2pAnswerBtn">CONNECT WITH ANSWER</button>
  </div>
  <div id="p2pJoinBox" style="display:none">
   <b style="font-size:14px">1. Paste the host's OFFER code</b>
   <textarea id="p2pOfferIn" rows="4" style="width:100%;box-sizing:border-box;font:11px monospace;margin:4px 0;padding:6px;border:2px solid #E8B4C8;border-radius:8px"></textarea>
   <button id="mpP2pCreateAnsBtn">CREATE MY ANSWER</button>
   <b style="font-size:14px;display:block;margin-top:10px">2. Send this ANSWER code to the host</b>
   <textarea id="p2pAnswerOut" rows="4" readonly style="width:100%;box-sizing:border-box;font:11px monospace;margin:4px 0;padding:6px;border:2px solid #E8B4C8;border-radius:8px"></textarea>
   <button id="p2pAnswerCopyBtn">COPY ANSWER</button>
  </div>
 </div>
 <div id="mpStatus"></div><button id="mpBackBtn" style="margin-top:10px">BACK</button></div>
<div id="chatLog"></div><div id="chatBar"><input id="chatInput" maxlength="100" placeholder="Message — Enter to send, Esc to cancel"></div>
<button id="modeBtn">SWITCH TO 9-BALL</button>
<script>
'use strict';
/* =====================================================================
   PASTEL POOL (FINAL) — single-file 8-ball / 9-ball pool game
   Modern ES6+ class architecture, sections in strict order:
     CONFIG -> Core (pure logic: rand/shuffle, Physics, Rules, AI)
     -> Players -> Game (state & commands) -> Renderer
     -> Input -> Sound -> App (bootstrap & main loop)
   The Core section (between the __CORE__ markers) is pure logic:
   no DOM references, exported on globalThis.PastelPoolCore so
   test/smoke.js can extract and run it in Node.
   ===================================================================== */

/* ============================ CONFIG ============================ */
const CFG = {
  W: 1920, H: 1080,
  TABLE_W: 1440, TABLE_H: 720,             // playing surface px (2:1)
  SCALE: 1440 / 2540,                      // px per mm (WPA 2540x1270 mm)
  BALL_R: 1.5 * 28.575 * (1440 / 2540),     // ball r px, 1.5x scale (D 48.6 px)
  RAIL_BAND: 64,                           // wood rail width px
  TABLE_X: 176, TABLE_Y: 116,              // outer table top-left in canvas px
  HEAD_STRING: 360,
  FOOT_SPOT: { x: 1080, y: 360 },
  CUE_START: { x: 360, y: 360 },

  buildTable() {

    c.fillStyle = cg; c.fillRect(fx - 4, fy - 4, CFG.TABLE_W + 8, CFG.TABLE_H + 8);

      c.beginPath();
      c.arc(fx + Math.random() * CFG.TABLE_W, fy + Math.random() * CFG.TABLE_H,

    let sg = c.createLinearGradient(fx, fy, fx, fy + 30);
    sg.addColorStop(0, 'rgba(40,30,50,0.22)'); sg.addColorStop(1, 'rgba(40,30,50,0)');
    c.fillStyle = sg; c.fillRect(fx, fy, CFG.TABLE_W, 30);

    c.fillStyle = sg; c.fillRect(fx + CFG.TABLE_W - 16, fy, 16, CFG.TABLE_H);
    sg = c.createLinearGradient(fx, fy + CFG.TABLE_H - 16, fx, fy + CFG.TABLE_H);
    sg.addColorStop(0, 'rgba(40,30,50,0)'); sg.addColorStop(1, 'rgba(40,30,50,0.08)');

    c.moveTo(CFG.TABLE_X + 28, CFG.TABLE_Y);
    c.arcTo(CFG.TABLE_X + 1568, CFG.TABLE_Y, CFG.TABLE_X + 1568, CFG.TABLE_Y + 848, 28);
    c.arcTo(CFG.TABLE_X + 1568, CFG.TABLE_Y + 848, CFG.TABLE_X, CFG.TABLE_Y + 848, 28);
    c.arcTo(CFG.TABLE_X, CFG.TABLE_Y + 848, CFG.TABLE_X, CFG.TABLE_Y, 28);
    c.arcTo(CFG.TABLE_X, CFG.TABLE_Y, CFG.TABLE_X + 1568, CFG.TABLE_Y, 28);

    c.arcTo(T_OX, T_OY + CFG.TABLE_H, T_OX, T_OY, 14);

  drawBall(x, y, id) {
    const ctx = this.ctx;
    const X = this.tx(x), Y = this.ty(y), R = CFG.BALL_R;
    // soft drop shadow falling south-east (light from upper-left)
    ctx.save();
    ctx.translate(X + R * 0.26, Y + R * 0.26);
    ctx.scale(1, 0.72);
    const bsh = ctx.createRadialGradient(0, 0, R * 0.15, 0, 0, R * 1.2);
    bsh.addColorStop(0, 'rgba(70,50,80,0.20)');
    bsh.addColorStop(0.65, 'rgba(70,50,80,0.12)');
    bsh.addColorStop(1, 'rgba(70,50,80,0)');

    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(X, Y, R, 0, TAU); ctx.clip();
    ctx.fillStyle = Renderer.baseColor(id);
    ctx.fillRect(X - R, Y - R, 2 * R, 2 * R);
    if (id > 8) {
      ctx.fillStyle = CFG.BALL_COLORS[id];
      ctx.fillRect(X - R, Y - R * 0.55, 2 * R, R * 1.1);

    const gl = ctx.createRadialGradient(X - R * 0.4, Y - R * 0.5, 1, X - R * 0.4, Y - R * 0.5, R * 1.3);
    gl.addColorStop(0, 'rgba(255,255,255,0.55)');
    gl.addColorStop(0.4, 'rgba(255,255,255,0.12)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(X - R, Y - R, 2 * R, 2 * R);
    ctx.restore();
    if (id >= 1) {
      ctx.beginPath(); ctx.arc(X, Y, R * 0.52, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.fillStyle = '#5A4A6A';
      ctx.font = 'bold ' + Math.round(R * 0.78) + 'px "Segoe UI",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  drawArrow(x, y, dx, dy, color) {
    const ctx = this.ctx;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
    const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;

    ctx.beginPath();

    ctx.lineTo(hx - ux * 14 + uy * 7, hy - uy * 14 - ux * 7);

  renderAim() {
    const ctx = this.ctx;
    const state = this.app.game.state;
    const c = state.balls[0];
    const a = state.aim.angle, dx = Math.cos(a), dy = Math.sin(a);
    const X = this.tx(c.x), Y = this.ty(c.y), R = CFG.BALL_R;
    let bestT = Infinity, hitB = null;
    for (const b of state.balls) {
      if (!b.inPlay || b.id === 0) continue;
      const ox = this.tx(b.x) - X, oy = this.ty(b.y) - Y;
      const proj = ox * dx + oy * dy;
      if (proj <= 0) continue;
      const d2 = ox * ox + oy * oy - proj * proj;
      const minD2 = (2 * R) * (2 * R);
      if (d2 > minD2) continue;
      const t = proj - Math.sqrt(minD2 - d2);
      if (t < bestT) { bestT = t; hitB = b; }
    }
    const len = hitB ? bestT : 700;
    const gx = X + dx * len, gy = Y + dy * len;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(X + dx * (R + 4), Y + dy * (R + 4)); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.setLineDash([]);
    if (hitB) {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(gx, gy, R, 0, TAU); ctx.stroke();
      const ox2 = this.tx(hitB.x) - gx, oy2 = this.ty(hitB.y) - gy;
      const ol = Math.hypot(ox2, oy2) || 1;
      const ux = ox2 / ol, uy = oy2 / ol;
      this.drawArrow(gx + ux * (R + 6), gy + uy * (R + 6), ux * 120, uy * 120, 'rgba(255,217,61,0.95)');
      const txx = dx - (dx * ux + dy * uy) * ux;
      const tyy = dy - (dx * ux + dy * uy) * uy;
      const tl = Math.hypot(txx, tyy);
      if (tl > 0.05) this.drawArrow(gx + txx / tl * R, gy + tyy / tl * R, txx / tl * 60, tyy / tl * 60, 'rgba(110,198,255,0.9)');
    }
    ctx.restore();
    // cue stick
    const pull = R + CFG.TIP_GAP + state.aim.power * CFG.PULLBACK;
    const bx = X - dx * pull, by = Y - dy * pull;
    const ex = bx - dx * CFG.CUE_LEN, ey = by - dy * CFG.CUE_LEN;
    ctx.save();
    ctx.lineCap = 'round';
    const grad = ctx.createLinearGradient(bx, by, ex, ey);
    grad.addColorStop(0, '#7EC8E3'); grad.addColorStop(0.03, '#F5D7A0');
    grad.addColorStop(0.55, '#DFB57C'); grad.addColorStop(1, '#8B5A3C');
    ctx.strokeStyle = grad; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#8B5A3C'; ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(bx - dx * (CFG.CUE_LEN - 190), by - dy * (CFG.CUE_LEN - 190));
    ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
  }

      rr(ctx, x, y, w, h, 20); ctx.strokeStyle = '#FF8FAB'; ctx.lineWidth = 3; ctx.stroke();

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#5A4A6A'; ctx.font = 'bold 20px "Segoe UI",sans-serif';
    ctx.fillText(p.name, x + 18, y + 26);

    if (state.mode === '8ball') {

      ctx.fillText('CPU SKILL', 960, 550);
      this.menuBtn('EASY', 740, 600, 180, 50, settings.aiLevel === 'easy', () => { settings.aiLevel = 'easy'; });
      this.menuBtn('MEDIUM', 960, 600, 180, 50, settings.aiLevel === 'medium', () => { settings.aiLevel = 'medium'; });
      this.menuBtn('HARD', 1180, 600, 180, 50, settings.aiLevel === 'hard', () => { settings.aiLevel = 'hard'; });

    this.menuBtn('INSTRUCTIONS', 960, insY, 300, 56, false, () => { sound.click(); game.menuScreen = 'instructions'; });
    this.menuBtn('START', 960, startY, 300, 80, false, () => { sound.click(); game.applyCommand({ type: 'start' }); }, 34);
  }
  renderInstructions() {
    const ctx = this.ctx;
    const game = this.app.game;
    const sound = this.app.sound;
    this.uiBtns = [];
    ctx.fillStyle = 'rgba(255,233,243,0.92)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.shadowColor = 'rgba(90,74,106,.2)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    rr(ctx, 560, 140, 800, 770, 28);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.restore();
    rr(ctx, 560, 140, 800, 770, 28); ctx.strokeStyle = '#FF8FAB'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#5A4A6A'; ctx.font = '800 54px "Baloo 2","Segoe UI",sans-serif';
    ctx.fillText('HOW TO PLAY', 960, 200);
    const H = (text, y) => { ctx.fillStyle = '#FF8FAB'; ctx.font = '700 24px "Baloo 2","Segoe UI",sans-serif'; ctx.fillText(text, 960, y); };
    const L = (text, y) => { ctx.fillStyle = '#6A5A7A'; ctx.font = '20px "Segoe UI",sans-serif'; ctx.fillText(text, 960, y); };
    H('GOAL', 268);
    L('8-BALL - clear your group of seven, then pot the 8-ball.', 304);
    L('9-BALL - always strike the lowest-numbered ball first; pot the 9 to win.', 332);
    H('AIMING', 436);
    L('Move the mouse to aim - the dashed line and ghost ball show the cue\'s path.', 464);
    L('Hold SHIFT or the RIGHT MOUSE BUTTON to switch to', 492);
    L('slow, precise fine-aiming for tricky shots.', 520);
    H('SHOOTING', 624);
    L('Hold the LEFT MOUSE BUTTON to charge - the gauge sweeps up, then back down.', 652);
    L('Release to shoot. A quick tap cancels the charge.', 680);
    H('BALL IN HAND', 784);
    L('After a foul, move the mouse to place the cue ball and click to drop it.', 812);
    L('Green ring = legal spot, red ring = not legal.', 840);
    L('Some fouls (e.g. scratching on the 8-ball break) limit you to behind the head string.', 868);
    this.menuBtn('BACK', 960, 970, 220, 56, false, () => { sound.click(); game.menuScreen = 'main'; }, 24);
  }
  renderGameOver() {
    const ctx = this.ctx;
    const state = this.app.game.state;
    const game = this.app.game;
    const sound = this.app.sound;
    ctx.fillStyle = 'rgba(255,233,243,0.85)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.save();
    ctx.shadowColor = 'rgba(90,74,106,.2)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    rr(ctx, 560, 370, 800, 250, 28);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.restore();
    rr(ctx, 560, 370, 800, 250, 28); ctx.strokeStyle = '#FF8FAB'; ctx.lineWidth = 4; ctx.stroke();
    const w = state.winner;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#5A4A6A'; ctx.font = '800 56px "Baloo 2","Segoe UI",sans-serif';
    ctx.fillText((w >= 0 ? state.players[w].name : '') + ' WINS!', 960, 455);
    ctx.font = '26px "Segoe UI",sans-serif'; ctx.fillStyle = '#9A8AA8';
    ctx.fillText(state.winReason, 960, 515);
    // Multiplayer routing: the client REQUESTS rematch/menu; the host
    // (authoritative) applies it and syncs via snapshots. Singleplayer unchanged.
    this.menuBtn('REMATCH', 840, 700, 220, 56, false, () => {
      sound.click();
      if (this.app.net.role === 'client') this.app.net.send({ type: 'cmd', kind: 'rematch' });
      else game.applyCommand({ type: 'rematch' });
    });
    this.menuBtn('MENU', 1080, 700, 220, 56, false, () => {
      sound.click();
      if (this.app.net.role === 'client') this.app.net.send({ type: 'cmd', kind: 'menu' });
      else game.applyCommand({ type: 'menu' });
    });
  }
  // RASTER STABILITY BLIT — the jitter fix. Why 1x1: still dirties the ~256px
  // Chromium raster tile the old 640x118 rect did (the late-dirty is the cure),
  // at 1px cost. Why the spot (12, CFG.H-12): center of the 12px border-radius
  // arc — a literal-corner pixel is clipped by the CSS radius and never
  // composited. Why late: the opaque paint must be LAST-DIRTY of the tile
  // region, at the END of render(), after all overlays/HUD. Why pixel-identical:
  // source == dest rect, uniform integer scale transform; zero-alpha paints
  // get optimized away and don't count; the 1x1 overlay-repair fills below
  // tint it over menu/gameOver dim overlays. Regression: if the jitter
  // returns, restore a LARGER late blit — the 640x118 rect at (16, CFG.H-138)
  // cured it.
  drawStabilityBlit() {
    const ctx = this.ctx;
    ctx.drawImage(this.tableCv, 12, CFG.H - 12, 1, 1, 12, CFG.H - 12, 1, 1);
    // Overlay repair: same 1x1, same logic — the blit paints LATE, over the
    // dim overlays, so tint this pixel with the overlay's own color. It sits
    // on a table-identical pixel, so the tint is pixel-identical to
    // surroundings — no chomp.
    const state = this.app.game.state;
    if (!state) { ctx.fillStyle = 'rgba(255,233,243,0.92)'; ctx.fillRect(12, CFG.H - 12, 1, 1); }
    else if (state.phase === 'gameOver') { ctx.fillStyle = 'rgba(255,233,243,0.85)'; ctx.fillRect(12, CFG.H - 12, 1, 1); }
  }
  // Per-frame raster stability flush: the getBoundingClientRect() sync
  // flush keeps the per-frame-updated canvas texture raster aligned (a
  // browser/GPU compositor quirk re-rasterizes it in ~256px tiles with
  // 1px rounding drift). The blit's LATE paint is required (must be
  // last-dirty of its tile region; zero-alpha paints don't count).
  stabilityBlitFrame() {
    this.cv.getBoundingClientRect();  // sync flush; no value needed
    this.drawStabilityBlit();
  }
  render() {
    const ctx = this.ctx;
    const game = this.app.game;
    const input = this.app.input;
    const state = game.state;
    ctx.drawImage(this.tableCv, 0, 0);
    this.uiBtns = [];
    if (!state) { if (game.menuScreen === 'instructions') this.renderInstructions(); else this.renderMenu(); }
    else {
      const cueIsCursor = state.phase === 'ballsInHand' && !state.players[state.current].isCPU;
      for (const b of state.balls) if (b.inPlay && !(cueIsCursor && b.id === 0)) this.drawBall(b.x, b.y, b.id);
      if (state.phase === 'ballsInHand' && !state.players[state.current].isCPU) {
        const gx = input.mouse.x - T_OX, gy = input.mouse.y - T_OY;
        const valid = game.canPlace(gx, gy);
        this.drawBall(gx, gy, 0);  // full-opacity cue ball as the cursor
        ctx.lineWidth = 3; ctx.strokeStyle = valid ? 'rgba(124,227,163,0.95)' : 'rgba(232,106,106,0.95)';
        ctx.beginPath(); ctx.arc(input.mouse.x, input.mouse.y, CFG.BALL_R + 7, 0, TAU); ctx.stroke();
        if (state.ballsInHand.behind) {
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.fillRect(this.tx(0), this.ty(0), this.tx(CFG.HEAD_STRING) - this.tx(0), CFG.TABLE_H);
          ctx.strokeStyle = 'rgba(124,227,163,0.6)'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
          ctx.beginPath(); ctx.moveTo(this.tx(CFG.HEAD_STRING), this.ty(0)); ctx.lineTo(this.tx(CFG.HEAD_STRING), this.ty(CFG.TABLE_H)); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      if (game.isAimPhase() && state.balls[0].inPlay) this.renderAim();
      this.renderHUD();
      if (state.phase === 'gameOver') this.renderGameOver();
    }
    this.stabilityBlitFrame();  // late, pixel-identical no-op blit — keeps the Chromium raster tile stable
  }
  fit() {
    // Element stays at integer device px with an integer device-px offset; the
    // backing store is W*scale x H*scale and the compositor does the final
    // (stable) scale to the CSS size — the same code path as an <img>.
    const dpr = window.devicePixelRatio || 1;
    const s = Math.min(window.innerWidth / CFG.W, window.innerHeight / CFG.H);
    const bw = Math.max(2, Math.round(CFG.W * s * dpr));   // device px, integer
    const bh = Math.max(2, Math.round(CFG.H * s * dpr));
    const scale = (Number.isInteger(dpr) && dpr > 0) ? dpr : 1;
    if (scale !== this.bsScale) {
      this.bsScale = scale;
      this.cv.width = CFG.W * scale; this.cv.height = CFG.H * scale;
      this.ctx.setTransform(scale, 0, 0, scale, 0, 0);  // game px -> backing px, integer (width assignment resets context state, so set immediately after)
    }
    this.cv.style.width  = (bw / dpr) + 'px';
    this.cv.style.height = (bh / dpr) + 'px';
    this.cv.style.left = (Math.round((window.innerWidth * dpr - bw) / 2) / dpr) + 'px';
    this.cv.style.top  = (Math.round((window.innerHeight * dpr - bh) / 2) / dpr) + 'px';
    this.viewBH = bh;
  }
}

/* ============================ Input =============================== */
class Input {
  constructor(app) {
    this.app = app;
    this.mouse = { x: 960, y: 540, charging: false, chargeT: 0 };
    this.heldKeys = new Set();
    this.fineAim = null;   // { baseAngle, baseRaw } while Shift or RMB held (mouse aim at FINE_AIM sensitivity)
    this.shiftHeld = false;
    this.rmbHeld = false;  // independent fine-aim hold flags
    const cv = app.renderer.cv;
    cv.addEventListener('mousemove', e => this.onMove(e));
    cv.addEventListener('mousedown', e => this.onDown(e));
    cv.addEventListener('contextmenu', e => e.preventDefault());  // RMB is fine-aim, not a menu
    window.addEventListener('mouseup', e => this.onUp(e));
    window.addEventListener('keydown', e => this.onKeyDown(e));
    window.addEventListener('keyup', e => this.onKeyUp(e));
  }
  canvasPos(e) {
    const r = this.app.renderer.cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (CFG.W / r.width),
             y: (e.clientY - r.top) * (CFG.H / r.height) };
  }
  enterFineAim() {
    // Multiplayer: fine aim is only ours to own on our own turn; on the
    // opponent's turn the idle side just mirrors their live aim.
    if (this.fineAim || !this.app.isMyTurn() || !this.app.game.isAimPhase()) return;
    const c = this.app.game.state.balls[0];
    this.fineAim = { baseAngle: this.app.game.state.aim.angle,
                     baseRaw: Math.atan2(this.mouse.y - this.app.renderer.ty(c.y), this.mouse.x - this.app.renderer.tx(c.x)) };
  }
  exitFineAim() { if (!this.shiftHeld && !this.rmbHeld) this.fineAim = null; }
  onMove(e) {
    const game = this.app.game;
    const renderer = this.app.renderer;
    const p = this.canvasPos(e); this.mouse.x = p.x; this.mouse.y = p.y;
    if (this.fineAim && !game.isAimPhase()) this.fineAim = null;
    if (!game.state) return;
    if (game.isAimPhase()) {
      // Multiplayer: the local mouse must never steer the cue on the
      // opponent's turn — state.aim here is driven by the remote peer's
      // input (host side) or host snapshots (client side).
      if (!this.app.isMyTurn()) return;
      const c = game.state.balls[0];
      const dx0 = this.mouse.x - renderer.tx(c.x), dy0 = this.mouse.y - renderer.ty(c.y);
      if (!this.fineAim && (this.shiftHeld || this.rmbHeld)) this.enterFineAim();  // re-anchor if a hold flag survived a phase change
      if (this.fineAim) {
        const raw = Math.atan2(dy0, dx0);
        game.state.aim.angle = this.fineAim.baseAngle + normAng(raw - this.fineAim.baseRaw) * CFG.FINE_AIM;
      } else if (dx0 * dx0 + dy0 * dy0 > 4) {
        game.state.aim.angle = Math.atan2(dy0, dx0);
      }
    }
  }
  onDown(e) {
    const game = this.app.game;
    this.app.sound.ensure();
    const p = this.canvasPos(e); this.mouse.x = p.x; this.mouse.y = p.y;
    if (e.button === 2) { this.rmbHeld = true; this.enterFineAim(); return; }  // RMB: fine aim only (never charges, never places, never clicks buttons)
    if (e.button !== 0) return;
    for (const b of this.app.renderer.uiBtns)
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { this.app.sound.click(); b.cb(); return; }
    if (!game.state) return;
    if (game.state.phase === 'ballsInHand') {
      if (this.app.isMyTurn()) {  // multiplayer: placing on the opponent's turn is meaningless — ignore
        // Thin client: request placement from the authoritative host.
        if (this.app.net.role === 'client') this.app.net.send({ type: 'cmd', kind: 'placeCue', x: this.mouse.x - T_OX, y: this.mouse.y - T_OY });
        else game.applyCommand({ type: 'placeCue', x: this.mouse.x - T_OX, y: this.mouse.y - T_OY });
      }
      return;
    }
    if (this.app.isMyTurn() && game.isAimPhase()) {  // charging is only ever ours
      this.mouse.charging = true; this.mouse.chargeT = 0; game.state.aim.power = 0;
    }
  }
  onUp(e) {
    const game = this.app.game;
    if (e.button === 2) { this.rmbHeld = false; this.exitFineAim(); return; }
    if (this.mouse.charging) {
      this.mouse.charging = false;
      if (this.app.isMyTurn() && game.isAimPhase()) {
        if (game.state.aim.power < CFG.MIN_POWER) game.state.aim.power = 0;  // quick tap = cancel, no shot
        else if (this.app.net.role === 'client') this.app.net.send({ type: 'cmd', kind: 'shoot' });  // thin client asks the host
        else game.applyCommand({ type: 'shoot' });
      }
    }
  }
  onKeyDown(e) {
    const k = e.key;
    // While chat is open NO game key does anything (no shoot, no quit, no place).
    // Must come before preventDefault so typing a space in the input works.
    if (this.app.chat.open) {
      if (k === 'Enter') this.app.chat.submit();
      else if (k === 'Escape') this.app.chat.close();
      return;
    }
    if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
    if (e.repeat) return;
    this.app.sound.ensure();
    const game = this.app.game;
    if (k === 'Escape') {
      // Multiplayer: tell the peer so both sides drop to the menu together.
      const net = this.app.net;
      if (game.state && net.ready()) net.send({ type: 'cmd', kind: 'menu' });
      if (!game.state && game.menuScreen !== 'main') game.menuScreen = 'main'; else game.state = null;
      return;
    }
    if (k === 'Shift') { this.shiftHeld = true; this.enterFineAim(); return; }
    if (!game.state) return;
    // Multiplayer: keyboard game actions (place / rotate / power / shoot)
    // only count on our own turn — same gate as the mouse path.
    const human = this.app.isMyTurn();
    // In a live multiplayer game Enter opens chat INSTEAD of placing/shooting.
    const mpLive = this.app.net.ready();
    if (k === 'Enter' && mpLive && game.state.phase !== 'gameOver') { this.app.chat.openChat(); return; }
    if (game.state.phase === 'ballsInHand' && human && (k === 'Enter' || k === ' ')) {
      if (this.app.net.role === 'client') this.app.net.send({ type: 'cmd', kind: 'placeCue', x: this.mouse.x - T_OX, y: this.mouse.y - T_OY });
      else game.applyCommand({ type: 'placeCue', x: this.mouse.x - T_OX, y: this.mouse.y - T_OY });
      return;
    }
    if (human && game.isAimPhase()) {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { game.state.aim.angle -= 0.1 * Math.PI / 180; this.heldKeys.add('L'); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { game.state.aim.angle += 0.1 * Math.PI / 180; this.heldKeys.add('R'); }
      else if (k === 'ArrowUp' || k === 'w' || k === 'W') { game.state.aim.power = Math.min(1, game.state.aim.power + 0.05); }
      else if (k === 'ArrowDown' || k === 's' || k === 'S') { game.state.aim.power = Math.max(CFG.MIN_POWER, game.state.aim.power - 0.05); }
      else if (k === 'Enter' || k === ' ') {  // Enter only reaches here in singleplayer / 2P local (mpLive guard consumed it otherwise)
        if (this.app.net.role === 'client') this.app.net.send({ type: 'cmd', kind: 'shoot' });
        else game.applyCommand({ type: 'shoot' });
      }
    }
  }
  onKeyUp(e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') this.heldKeys.delete('L');
    if (k === 'ArrowRight' || k === 'd' || k === 'D') this.heldKeys.delete('R');
    if (k === 'Shift') { this.shiftHeld = false; this.exitFineAim(); }
  }
}

/* ============================ Sound =============================== */
class Sound {
  constructor() { this.ctx = null; this.lastHitT = 0; }
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (err) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  env(dur, vol) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
    g.connect(this.ctx.destination);
    return g;
  }
  tone(freq, dur, type, vol, slideTo) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, this.ctx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + dur);
    o.connect(this.env(dur, vol));
    o.start(); o.stop(this.ctx.currentTime + dur);
  }
  noise(dur, vol) {
    if (!this.ctx) return;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    src.connect(this.env(dur, vol)); src.start();
  }
  cueHit(p) { this.noise(0.06, 0.25 * p + 0.1); this.tone(150, 0.06, 'sine', 0.3); }
  hit(intensity) {
    const now = performance.now();
    if (now - this.lastHitT < 40) return;
    this.lastHitT = now;
    this.tone(800, 0.035, 'triangle', Math.min(0.35, 0.05 + intensity * 0.35));
  }
  cushion() { this.tone(200, 0.05, 'sine', 0.2); }
  pocket() { this.tone(600, 0.15, 'sine', 0.3, 200); }
  click() { this.tone(600, 0.03, 'square', 0.12); }
  win() {
    if (!this.ctx) return;
    [523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => this.tone(f, 0.25, 'triangle', 0.25), i * 130));
  }
}

/* ====================== Multiplayer (P2P WebRTC) ===================
   Two browsers on the LAN pair over a WebRTC data channel (manual
   copy/paste signaling codes — no server).
   The host is AUTHORITATIVE: it runs the real Game and ships throttled
   state snapshots; the client is THIN — it renders the latest snapshot
   and sends input/cmd/chat messages (it never ticks physics).
   Protocol (JSON):
     peer->peer     : input {charging, angle, power, mouse}   (client -> host, ~30 Hz)
                      cmd {kind:'shoot'|'placeCue'|'rematch'|'ballmode'|'menu', x?, y?}
                      chat {text}
     host->client   : state {state, evts[], charging}  (full snapshot + frame events
                      for sfx; charging = host's local charge flag so the client can
                      free-run the host's power integration at render rate)
   ================================================================ */
class Net {
  constructor(app) {
    this.app = app;
    this.pc = null;            // RTCPeerConnection
    this.dc = null;            // P2P mode (RTCDataChannel)
    this.p2pStage = null;      // P2P: 'offer' (host, awaiting answer) | 'answer' (joiner, awaiting offer)
    this.role = null;          // 'host' | 'client' — set locally by p2pHost() / p2pAcceptOffer()
    this.names = [];           // display names, index = peer slot
    this.remoteCmds = [];      // queued client commands, drained by frame()
    this.remoteAim = null;     // latest client aim, applied once per frame
    // Input-shaped object the host ticks with while it's the remote
    // player's turn (same shape as the local Input instance).
    this.remoteInput = { mouse: { x: 960, y: 540, charging: false, chargeT: 0 }, heldKeys: new Set() };
    // CLIENT-side mirror of the HOST's charge (inverse of remoteInput), driven by
    // the snapshot's `charging` field so the client can free-run the host's power
    // integration at render rate.
    this.hostInput = { mouse: { x: 960, y: 540, charging: false, chargeT: 0 }, heldKeys: new Set() };
    this.lastSnapT = 0; this.lastSnapPhase = null;  // snapshot throttle (33 ms / phase change)
    this.lastInputT = 0;                            // client input pump throttle (~30 Hz)
    // --- DOM wiring (multiplayer panel), once at construction ---
    this.el = {
      panel: document.getElementById('mpPanel'),
      status: document.getElementById('mpStatus'),
      p2pOfferBox: document.getElementById('p2pOfferBox'), p2pJoinBox: document.getElementById('p2pJoinBox'),
      p2pOfferOut: document.getElementById('p2pOfferOut'), p2pAnswerIn: document.getElementById('p2pAnswerIn'),
      p2pOfferIn: document.getElementById('p2pOfferIn'), p2pAnswerOut: document.getElementById('p2pAnswerOut'),
      modeBtn: document.getElementById('modeBtn'),
    };
    document.getElementById('mpBackBtn').addEventListener('click', () => { app.sound.click(); this.disconnect(); });
    // --- P2P (server-free WebRTC, manual copy/paste signaling) ---
    document.getElementById('mpP2pHostBtn').addEventListener('click', () => this.p2pHost());
    document.getElementById('mpP2pJoinBtn').addEventListener('click', () => this.p2pJoin());
    document.getElementById('mpP2pCreateAnsBtn').addEventListener('click', () => this.p2pAcceptOffer(this.el.p2pOfferIn.value));
    document.getElementById('p2pAnswerBtn').addEventListener('click', () => this.p2pAcceptAnswer(this.el.p2pAnswerIn.value));
    document.getElementById('p2pOfferCopyBtn').addEventListener('click', () => this.copyTarea(this.el.p2pOfferOut));
    document.getElementById('p2pAnswerCopyBtn').addEventListener('click', () => this.copyTarea(this.el.p2pAnswerOut));
    document.getElementById('p2pOfferRegenBtn').addEventListener('click', () => { app.sound.click(); this.p2pReset(); this._p2pCreateOffer('Generating a fresh OFFER\u2026'); });
    // Mid-game mode toggle: the host applies it DIRECTLY (authoritative; its
    // dc.send only reaches the guest, never itself); the client sends the cmd
    // and the host acts in onMessage. The button is a <body> child, so canvas
    // input listeners never see it.
    this.el.modeBtn.addEventListener('click', () => {
      app.sound.click();
      if (!this.role) return;
      if (this.role === 'client') { this.send({ type: 'cmd', kind: 'ballmode' }); return; }
      const s = app.game.state;
      if (s) { app.settings.mode = s.mode === '8ball' ? '9ball' : '8ball'; app.game.applyCommand({ type: 'rematch' }); }
    });
  }
  // --- The WebRTC RTCDataChannel is the only transport: it uses
  //     readyState for OPEN and .send(string), so everything outside
  //     wireDc()/disconnect() goes through these two helpers.
  link() { return this.dc; }
  // Some engines expose RTCDataChannel.readyState as the number 1 and others
  // as the string "open" — accept both (a numeric-only check silently dead
  // every send on the string engines).
  _dcOpen(t) { return !!(t && (t.readyState === 1 || t.readyState === 'open')); }
  ready() { return !!(this.role && this._dcOpen(this.link())); }

  // --- Manual signaling codes: tagged base64 JSON {v:1, sdp}, 64-char lines
  codeFor(tag, sdp) {
    return tag + btoa(JSON.stringify({ v: 1, sdp })).replace(/(.{64})/g, '$1\n');
  }
  parseCode(text, expectTag) {
    const tagLen = expectTag.length;
    const t = String(text || '').trim();  // trim both ends (pastes often carry a leading newline)
    if (!t.startsWith(expectTag)) throw new Error('Wrong code type - that does not look like an OFFER/ANSWER code');
    const body = t.slice(tagLen).replace(/\s+/g, '');
    let obj;
    try { obj = JSON.parse(atob(body)); } catch (e) { throw new Error('Code is corrupted - copy it again, including every line'); }
    const sdp = obj && obj.sdp;
    if (typeof sdp !== 'string' || sdp.indexOf('v=0') < 0) throw new Error('Code is corrupted - copy it again, including every line');
    return sdp;
  }
  copyTarea(ta) {
    const done = () => this.setStatus('Copied \u2713');
    const fail = () => this.setStatus('Select all (Ctrl+A) and copy manually');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, fail);
    } else {
      ta.select();
      if (document.execCommand && document.execCommand('copy')) done(); else fail();
    }
  }

  // --- P2P (server-free WebRTC). The JSON protocol is carried over the
  //     WebRTC data channel.
  _p2pPC() {
    // LAN-only by design: no STUN — host candidates connect two devices on the
    // same network instantly and let iceGatheringState reach 'complete' in well
    // under a second. (Cross-NAT play is not a supported scenario.)
    return new RTCPeerConnection();
  }
  _p2pWaitGathering(pc) {
    // Resolves with true when the 10 s fallback fired before gathering finished.
    return new Promise(res => {
      if (pc.iceGatheringState === 'complete') { res(false); return; }
      let done = false;
      const finish = (timedOut) => { if (done) return; done = true; pc.removeEventListener('icegatheringstatechange', finish); res(!!timedOut); };
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') finish(false); });
      setTimeout(() => finish(true), 10000);  // safety net: still emits a code, possibly without all candidates
    });
  }
  // Honest status after the gathering fallback fires (or right after a normal
  // completion is NOT called — normal completion shows the step-by-step text).
  _p2pGatherStatus(timedOut, sdp) {
    if (!timedOut) return;
    const cand = (sdp.match(/a=candidate/g) || []).length;
    if (cand === 0) this.setStatus('\u26A0 No network address found - this code will not connect. Check the network and press REGENERATE.');
    else this.setStatus('\u26A0 Address gathering timed out - the code may be incomplete; if connecting fails, press REGENERATE.');
  }
  // Connection-state-driven status, attached to BOTH peers (host + guest).
  _p2pOnState(pc) {
    pc.onconnectionstatechange = () => {
      if (this.pc !== pc) return;  // a newer connection replaced this one
      const s = pc.connectionState;
      if (s === 'connecting') this.setStatus('Connecting to opponent\u2026');
      else if (s === 'connected') this.setStatus('Connected - pairing data channel\u2026');
      else if (s === 'disconnected') this.setStatus('Connection interrupted - reconnecting\u2026');
      else if (s === 'failed') {
        if (this.role === 'host') this.setStatus('Connection failed - try REGENERATE, and make sure both devices are on the same network (a single shared NAT can still block the link)');
        else this.setStatus('Connection failed - ask the host to REGENERATE, and make sure both devices are on the same network (a single shared NAT can still block the link)');
      }
      else if (s === 'closed') this.setStatus('Connection closed');
    };
  }
  wireDc(dc) {
    dc.onmessage = m => {
      let msg; try { msg = JSON.parse(m.data); } catch (err) { return; }
      msg.from = (this.role === 'host') ? 1 : 0;  // peer slot of the sender
      this.onMessage(msg);
    };
    dc.onopen = () => {
      if (this.dc !== dc) return;
      try {
        this.el.p2pOfferBox.style.display = 'none';
        this.el.p2pJoinBox.style.display = 'none';
        this.hidePanel();
        if (this.role === 'host') {
          this.setStatus('Connected - starting game\u2026');
          if (!this.app.game.state) this.app.startNetGame();
        } else {
          this.setStatus('Connected - waiting for the host\u2026');  // host snapshots arrive immediately
        }
      } catch (err) { this.setStatus('Error: ' + err.message); }
    };
    dc.onclose = () => {
      if (this.dc !== dc) return;  // a newer connection replaced this one
      const wasHost = this.role === 'host';
      const inGame = !!this.app.game.state;
      this.p2pReset();
      if (inGame) {
        this.app.chat.addMsg('Server', 'Connection lost');
        if (wasHost) this.app.game.setMessage('Opponent left - Esc for menu');
      }
      this.setStatus('Connection closed');
    };
  }
  p2pReset() {
    if (this.pc) { this.pc.onclose = null; this.pc.onconnectionstatechange = null; this.pc.oniceconnectionstatechange = null; try { this.pc.close(); } catch (err) {} }
    this.pc = null; this.dc = null; this.p2pStage = null;
    for (const id of ['p2pOfferOut', 'p2pAnswerIn', 'p2pOfferIn', 'p2pAnswerOut']) this.el[id].value = '';
    this.el.p2pOfferBox.style.display = 'none';
    this.el.p2pJoinBox.style.display = 'none';
  }
  p2pHost() {
    this.app.sound.click();
    this.disconnect();        // clears any old P2P state (also hides the panel)
    this.showPanel();         // so bring the panel back for the code exchange
    this._p2pCreateOffer();
  }
  // Creates a FRESH offer (pc + data channel + code). Called by p2pHost() and
  // by REGENERATE — every call invalidates the previous code pair.
  _p2pCreateOffer(status) {
    this.role = 'host';
    this.names = ['Player 1', 'Player 2'];
    this.app.chat.myName = 'Player 1';
    this.p2pStage = 'offer';
    this.el.p2pOfferBox.style.display = 'block';
    this.el.p2pJoinBox.style.display = 'none';
    this.setStatus(status || 'Preparing OFFER\u2026');
    const pc = this._p2pPC();
    this.pc = pc;
    this.dc = pc.createDataChannel('game');
    this.wireDc(this.dc);
    this._p2pOnState(pc);
    pc.createOffer().then(o => pc.setLocalDescription(o))
      .then(() => { this.setStatus('Gathering network addresses\u2026'); return this._p2pWaitGathering(pc); })
      .then(timedOut => {
        this.showOfferCode();
        if (timedOut) this._p2pGatherStatus(true, pc.localDescription.sdp);
        else this.setStatus('Step 1: send this OFFER code to your opponent (they press JOIN and paste it). Step 2: they will send you an ANSWER code - paste it below and press CONNECT WITH ANSWER.');
      })
      .catch(err => this.setStatus('Error: ' + err.message));
  }
  showOfferCode() {
    this.el.p2pOfferOut.value = this.codeFor('PPPOOL-OFFER:', this.pc.localDescription.sdp);
  }
  p2pJoin() {
    this.app.sound.click();
    this.p2pReset();
    this.p2pStage = 'answer';
    this.el.p2pJoinBox.style.display = 'block';
    this.el.p2pOfferBox.style.display = 'none';
    this.setStatus('Paste the host\u2019s OFFER code');
  }
  p2pAcceptOffer(codeText) {
    if (!this.p2pStage || this.p2pStage !== 'answer') { this.setStatus('Press JOIN first, then paste the OFFER code'); return; }
    let sdp;
    try { sdp = this.parseCode(codeText, 'PPPOOL-OFFER:'); }
    catch (err) { this.setStatus(err.message); return; }
    this.role = 'client';
    this.names = ['Player 1', 'Player 2'];
    this.app.chat.myName = 'Player 2';
    this.p2pReset();  // clears the paste boxes after capture
    this.p2pStage = 'answer';
    this.el.p2pJoinBox.style.display = 'block';
    this.setStatus('Preparing ANSWER\u2026');
    const pc = this._p2pPC();
    this.pc = pc;
    // MUST be set before setRemoteDescription, and must keep this.dc pointing
    // at the received channel so the wireDc guards (this.dc !== dc) don't bail.
    pc.ondatachannel = e => { this.dc = e.channel; this.wireDc(e.channel); };
    this._p2pOnState(pc);
    pc.setRemoteDescription({ type: 'offer', sdp })
      .then(() => pc.createAnswer())
      .then(a => pc.setLocalDescription(a))
      .then(() => { this.setStatus('Gathering network addresses\u2026'); return this._p2pWaitGathering(pc); })
      .then(timedOut => {
        this.el.p2pAnswerOut.value = this.codeFor('PPPOOL-ANSWER:', pc.localDescription.sdp);
        if (timedOut) this._p2pGatherStatus(true, pc.localDescription.sdp);
        else this.setStatus('Step 2: send this ANSWER code to the host - they paste it and press CONNECT. Waiting to connect\u2026');
      })
      .catch(err => this.setStatus('Error: ' + err.message));
  }
  p2pAcceptAnswer(answerText) {
    if (!this.pc || this.p2pStage !== 'offer') { this.setStatus('Press HOST first and wait for the OFFER code'); return; }
    let sdp;
    try { sdp = this.parseCode(answerText, 'PPPOOL-ANSWER:'); }
    catch (err) { this.setStatus(err.message); return; }
    this.setStatus('Connecting to opponent\u2026');
    this.pc.setRemoteDescription({ type: 'answer', sdp })
      .then(() => { /* dc.onopen fires the game start */ })
      .catch(err => this.setStatus('Error: ' + err.message));
  }

  onMessage(m) {
    const app = this.app;
    if (m.type === 'state') {
      // CLIENT: adopt the host's exact state (plain object) and play its sfx.
      const prev = app.game.state;
      app.game.state = m.state;           // null = back to menu (host pressed Esc)
      // Own-turn aim ownership: while THIS client is the active shooter the
      // cue/aim line/ghost ball/gauge are driven locally by Input in real time;
      // the host's copy of them lags one round trip, and overwriting with it
      // made the aim UI jitter and the power gauge advance at snapshot cadence.
      // Restored only mid-turn (prev was also our aim turn, same phase) so a
      // turn hand-off still adopts the snapshot (opponent's-turn mirror is
      // untouched), and balls/turn/scores/sfx always stay snapshot-driven.
      if (this.role === 'client' && m.state && prev &&
          prev.current === 1 && m.state.current === 1 &&
          m.state.phase === prev.phase &&
          (m.state.phase === 'aiming' || m.state.phase === 'breakAim')) {
        m.state.aim.angle = prev.aim.angle;
        m.state.aim.power = prev.aim.power;
      }
      // Adopt the host's charge flag so the client can free-run the host's power
      // integration at render rate (see the hostCharging case in App.frame).
      // On the false->true edge, align chargeT from the snapshot's power: the host
      // is <=~33 ms into its charge, i.e. on the ping-pong rising branch where
      // ping-pong(t) === t, so the snapshot's power IS the host's chargeT. A 0-reset
      // would leave a fixed <=33 ms offset visible on the gauge.
      if (this.role === 'client' && m.state) {
        const was = this.hostInput.mouse.charging;
        this.hostInput.mouse.charging = !!m.charging;
        if (!was && m.charging) this.hostInput.mouse.chargeT = m.state.aim.power;
      }
      app.pumpEvents(m.evts || []);
      return;
    }
    if (m.type === 'input') {
      // HOST: remote player's aim + charge. chargeT is driven by the host's
      // own tick while charging; reset it on the false->true edge.
      const was = this.remoteInput.mouse.charging;
      this.remoteInput.mouse.charging = !!m.charging;
      if (!was && m.charging) this.remoteInput.mouse.chargeT = 0;
      if (m.mouse) { this.remoteInput.mouse.x = m.mouse.x; this.remoteInput.mouse.y = m.mouse.y; }
      this.remoteAim = { angle: m.angle, power: m.power };
      return;
    }
    if (m.type === 'cmd') {
      if (this.role === 'host') {
        // Turn-independent commands apply immediately (authoritative host).
        if (m.kind === 'rematch') { app.game.applyCommand({ type: 'rematch' }); return; }
        if (m.kind === 'ballmode') {
          // 8/9-ball switch mid-game: flip settings, full restart — the fresh
          // rack + coin-flip break resyncs the thin client via the next
          // snapshot (≤33 ms, immediate on phase change). Allowed any phase.
          const s = app.game.state;
          if (s) { app.settings.mode = s.mode === '8ball' ? '9ball' : '8ball'; app.game.applyCommand({ type: 'rematch' }); }
          return;
        }
        if (m.kind === 'menu') {
          app.game.applyCommand({ type: 'menu' });
          this.send({ type: 'state', state: null, evts: [] });  // client back to menu too
          return;
        }
      } else if (m.kind === 'menu') {
        app.game.applyCommand({ type: 'menu' });  // host asked both to menu
        return;
      }
      this.remoteCmds.push({ kind: m.kind, x: m.x, y: m.y });
      return;
    }
    if (m.type === 'chat') {
      app.chat.addMsg(this.names[m.from] || 'Player', m.text);
      app.sound.click();
      return;
    }
  }
  // Called by App.frame (host, only while the remote player is the active one):
  // drain queued commands and apply the latest remote aim, then the host
  // tick below uses this.remoteInput so charge physics run on the host.
  frame(game, dt) {
    // Defensive turn gate: remote commands/aim may only ever act on the
    // remote player's (slot 1) turn. Dropping the stale leftovers too, so a
    // buggy or malicious client 'shoot'/'placeCue' can't leak into the next
    // turn — Game's own isCPU guards can't catch it (both MP players are human).
    if (!game.state || game.state.current !== 1) {
      this.remoteCmds.length = 0;
      this.remoteAim = null;
      return;
    }
    for (const c of this.remoteCmds) {
      if (c.kind === 'shoot') game.applyCommand({ type: 'shoot' });
      else if (c.kind === 'placeCue') game.applyCommand({ type: 'placeCue', x: c.x, y: c.y });
    }
    this.remoteCmds.length = 0;
    if (this.remoteAim && (game.isAimPhase() || game.state.phase === 'ballsInHand'))
      game.applyCommand({ type: 'aim', angle: this.remoteAim.angle, power: this.remoteAim.power });
    this.remoteAim = null;
  }
  // Host: throttled full-state snapshot (33 ms, or immediately on phase change).
  // 30 Hz keeps free-run drift tiny and makes the idle side's mirrored aim
  // feel live; the payload (~1.5 KB full state) is trivial on LAN.
  snapshot(game, dt, charging) {
    if (this.role !== 'host' || !this.link() || !game.state) return;
    const st = game.state;
    const now = performance.now();
    if (now - this.lastSnapT < 33 && this.lastSnapPhase === st.phase) return;
    this.lastSnapT = now; this.lastSnapPhase = st.phase;
    this.send({ type: 'state', state: st, evts: game.events, charging: !!charging });
  }
  send(msg) {
    const t = this.link();
    if (this._dcOpen(t)) { try { t.send(JSON.stringify(msg)); } catch (err) { console.error('dc.send failed', err); } }
  }
  showPanel() {
    this.el.panel.style.display = 'block';
    this.setStatus('');
  }
  hidePanel() { this.el.panel.style.display = 'none'; }
  setStatus(s) { this.el.status.textContent = s; }
  disconnect() {
    this.p2pReset();
    this.role = null; this.names = [];
    this.remoteCmds.length = 0; this.remoteAim = null;
    this.remoteInput.mouse.charging = false; this.remoteInput.mouse.chargeT = 0;
    this.hostInput.mouse.charging = false; this.hostInput.mouse.chargeT = 0;
    this.lastSnapT = 0; this.lastSnapPhase = null;
    this.hidePanel(); this.setStatus('');
  }
}

/* ============================ In-game chat =========================
   DOM overlay (chatLog = fading messages, chatBar = input). Keys are
   handled in Input.onKeyDown while open (Enter = send, Escape = cancel).
   Messages travel as {type:'chat',text} between the peers; the sender
   echoes locally via addMsg. textContent only — no innerHTML for text.
   ================================================================ */
class Chat {
  constructor(app) {
    this.app = app;
    this.open = false;
    this.myName = 'Player';
    this.log = document.getElementById('chatLog');
    this.bar = document.getElementById('chatBar');
    this.input = document.getElementById('chatInput');
  }
  openChat() {
    const net = this.app.net;
    if (!net.ready()) return;
    this.open = true;
    this.bar.style.display = 'block';
    this.input.focus();
  }
  close() {
    this.open = false;
    this.bar.style.display = 'none';
    if (document.activeElement === this.input) this.input.blur();
  }
  submit() {
    const text = this.input.value.trim();
    if (text) {
      const net = this.app.net;
      if (net.ready()) net.send({ type: 'chat', text });
      this.addMsg(this.myName, text);  // local echo (the peer gets it via the data channel)
    }
    this.input.value = '';
  }
  addMsg(name, text) {
    const row = document.createElement('div');
    const b = document.createElement('b');
    b.textContent = name + ': ';
    row.appendChild(b);
    row.appendChild(document.createTextNode(text));
    this.log.appendChild(row);
    while (this.log.children.length > 6) this.log.firstChild.remove();
    setTimeout(() => { row.style.opacity = '.35'; }, 4000);  // fade after ~4 s (CSS transition 2 s)
    setTimeout(() => row.remove(), 9000);
  }
}

/* ============================ App / Bootstrap ===================== */
class App {
  constructor() {
    this.settings = { mode: '8ball', vsCPU: true, aiLevel: 'medium', shotClockOn: true };
    this.game = new Game(this.settings);
    this.sound = new Sound();
    this.renderer = new Renderer(this);
    this.input = new Input(this);
    this.chat = new Chat(this);
    this.net = new Net(this);
    this.last = performance.now();
    this.lastCursor = null;
    this.lastModeBtnKey = null;  // compare-and-write key for #modeBtn (display + label)
    this.lastModeBtnX = null; this.lastModeBtnY = null;  // compare-and-write for #modeBtn position (canvas-anchored)
    this.renderer.buildTable();
    window.addEventListener('resize', () => this.renderer.fit());
    this.renderer.fit();
    // Preload the embedded display font; the menu re-renders every frame,
    // so it picks up Baloo 2 automatically once loaded (Segoe UI fallback
    // until then).
    try { if (document.fonts) { document.fonts.load('800 108px "Baloo 2"'); document.fonts.load('700 22px "Baloo 2"'); } } catch (e) {}
    requestAnimationFrame(t => this.frame(t));
  }
  // Host auto-starts the game the moment both players are connected.
  startNetGame() {
    this.settings.vsCPU = false;
    this.game.applyCommand({ type: 'start' });
    this.game.state.players[0].name = this.net.names[0] || 'Player 1';
    this.game.state.players[1].name = this.net.names[1] || 'Player 2';
    this.game.setMessage('Multiplayer - have fun!');
    this.net.hidePanel();
    this.net.lastSnapT = 0;  // force the initial snapshot out immediately
    this.net.snapshot(this.game, 0);
  }
  // True when the locally-controlled human is the active player.
  // Singleplayer / 2P-local (net.role null): both slots are local, so it
  // reduces to "the current player is human" — behavior is unchanged.
  isMyTurn() {
    const s = this.game.state;
    if (!s || s.players[s.current].isCPU) return false;
    const r = this.net.role;
    return !r || s.current === (r === 'client' ? 1 : 0);
  }
  frame(now) {
    const dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now;
    try {
    if (this.game.state) {
      if (this.net.role === 'client') {
        // THIN CLIENT: host snapshots drive authoritative state (no desync).
        // Pump local aim state to the host at ~30 Hz, but ONLY on our own
        // turn — sending during the host's turn would let stale aim/charge
        // leak into the opponent's shot.
        const st = this.game.state;
        const ourTurn = st.current === 1 &&
          (st.phase === 'aiming' || st.phase === 'breakAim' || st.phase === 'ballsInHand');
        if (ourTurn && now - this.net.lastInputT >= 33) {
          this.net.lastInputT = now;
          this.net.send({ type: 'input', charging: this.input.mouse.charging,
            angle: st.aim.angle, power: st.aim.power,
            mouse: { x: this.input.mouse.x, y: this.input.mouse.y } });
        }
        // While balls are rolling, free-run the same fixed-substep physics
        // the host runs (Game.tick is pure over state), so ball motion is
        // smooth at native render rate between host snapshots; the 30 Hz
        // snapshot replace stays authoritative and self-corrects drift.
        // On our own aiming turn the same tick also integrates the local
        // charge (ping-pong power) and held-key rotation in real time, so
        // the power gauge advances at render rate instead of in 30 Hz
        // snapshot steps; combined with Net.onMessage's own-turn aim
        // restore, the snapshot no longer fights the local aim. Gated on
        // active local aim input so an idle aiming turn still stays fully
        // snapshot-driven.
        // Third case: while the HOST is on its aim turn and actively charging,
        // free-run the same Game.tick charge integration driven by net.hostInput
        // (host's charge flag from the snapshot, chargeT aligned on the edge),
        // so the mirrored power gauge / cue pullback advance at native render
        // rate instead of in 30 Hz snapshot steps. hostInput.heldKeys is always
        // empty (no local angle rotation); the snapshot replace stays
        // authoritative and re-corrects the small integration offset.
        const hostCharging = st.current === 0 &&
          (st.phase === 'aiming' || st.phase === 'breakAim') &&
          this.net.hostInput.mouse.charging;
        if (st.phase === 'shooting') this.game.tick(dt, this.input);
        else if (ourTurn && (this.input.mouse.charging || this.input.heldKeys.size > 0)) this.game.tick(dt, this.input);
        else if (hostCharging) this.game.tick(dt, this.net.hostInput);
      } else {
        // Host (and singleplayer/CPU): full simulation. While the remote
        // player is the active one, drive the tick from their input.
        const remote = this.net.role === 'host' && this.game.state.current === 1;
        if (remote) this.net.frame(this.game, dt);
        this.game.applyCommand({ type: 'tick', dt, input: remote ? this.net.remoteInput : this.input });
        this.net.snapshot(this.game, dt, this.input.mouse.charging);
      }
    }
    const state = this.game.state;
    const cursor = (state && state.phase === 'ballsInHand' && !state.players[state.current].isCPU)
      ? 'none' : 'default';
    if (cursor !== this.lastCursor) { this.renderer.cv.style.cursor = cursor; this.lastCursor = cursor; }  // write style only on change
    // Mid-game 8/9-ball toggle button: visible only during a live network
    // game; label follows the (snapshot-driven on the client) current mode.
    const modeBtnKey = (this.net.ready() && state) ? state.mode : 'hidden';
    if (modeBtnKey !== this.lastModeBtnKey) {
      this.net.el.modeBtn.style.display = modeBtnKey === 'hidden' ? 'none' : 'block';
      this.net.el.modeBtn.textContent = modeBtnKey === '8ball' ? 'SWITCH TO 9-BALL' : 'SWITCH TO 8-BALL';
      this.lastModeBtnKey = modeBtnKey;
    }
    // Position: right edge at the table's outer wood-frame right edge (canvas x =
    // CFG.TABLE_X + 1568 = 1744), vertical center on the power-meter track center
    // (canvas y = 1000 + 20/2 = 1010). Canvas -> CSS mirrors Input.canvasPos():
    // the letterboxed #cv's bounding rect already encodes fit()'s scale+offset.
    // Only while visible (offsetWidth is 0 when display:none). Write style only on change.
    const btn = this.net.el.modeBtn;
    if (btn.style.display !== 'none') {
      const cr = this.renderer.cv.getBoundingClientRect();
      const bw = btn.offsetWidth, bh = btn.offsetHeight;
      const tx = Math.round(cr.left + (1744 / 1920) * cr.width - bw);
      const ty = Math.round(cr.top + (1010 / 1080) * cr.height - bh / 2);
      if (tx !== this.lastModeBtnX || ty !== this.lastModeBtnY) {
        btn.style.left = tx + 'px'; btn.style.top = ty + 'px';
        this.lastModeBtnX = tx; this.lastModeBtnY = ty;
      }
    }
    this.renderer.render();
    // The client plays sfx exclusively from the host's snapshot events
    // (pumpEvents(m.evts) in Net.onMessage); pumping its own free-run
    // event log here too would double up the sound effects.
    if (this.net.role !== 'client') this.pumpEvents();
    this.game.events.length = 0;
    } catch (err) { console.error(err); }  // one bad frame must never kill the rAF loop
    requestAnimationFrame(t => this.frame(t));
  }
  // evs optional: the client plays the host's snapshot events (m.evts) instead
  // of its own (always-empty) local log.
  pumpEvents(evs) {
    const sfx = this.sound;
    let hits = 0;
    for (const ev of (evs || this.game.events)) {
      switch (ev.type) {
        case 'cuehit': sfx.cueHit(ev.power); break;
        case 'hit': if (hits++ < 3) sfx.hit(Math.min(1, ev.speed / 1200)); break;
        case 'rail': sfx.cushion(); break;
        case 'pocket': sfx.pocket(); break;
        case 'place': sfx.click(); break;
        case 'win': sfx.win(); break;
      }
    }
  }
}
window.app = new App();  // debug/test hook
</script>
</body>
</html>
